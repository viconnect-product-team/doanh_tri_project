name: Deploy to Production Server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Server via SSH
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 14.225.217.232
          username: root
          password: ${{ secrets.SERVER_PASSWORD || '1T4dTddMh0tbzFwBCIlu' }}
          port: 22
          timeout: 120s
          command_timeout: 15m
          script: |
            set -e
            APP_DIR="/root/doanh_tri_project"
            REPO_URL="https://github.com/viconnect-product-team/doanh_tri_project.git"

            if [ ! -d "$APP_DIR" ]; then
              echo "==> Cloning repository..."
              git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            echo "==> Fetching latest changes..."
            git fetch origin main
            git reset --hard origin/main

            chmod +x deploy.sh
            ./deploy.sh
