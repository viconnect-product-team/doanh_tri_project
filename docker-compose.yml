services:
  doanh-tri-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doanh_tri_web
    restart: always
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NITRO_PORT=3000
      - NITRO_HOST=0.0.0.0
      - NODE_ENV=production
    env_file:
      - .env
    ports:
      - "127.0.0.1:5024:3000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
